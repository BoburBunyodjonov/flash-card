version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wordswipe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wordswipe
    ports:
      # Bind to localhost ONLY — never 0.0.0.0. A 0.0.0.0 bind exposed this DB
      # to the internet and an automated bot wiped it (ransomware). Dev DB must
      # stay reachable only from this machine.
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wordswipe-redis
    # Localhost-only for the same reason — Redis with no auth must not be public
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
