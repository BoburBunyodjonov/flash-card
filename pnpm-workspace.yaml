packages:
  - apps/*
  - packages/*

allowBuilds:
  '@firebase/util': false
  '@prisma/client': true
  '@prisma/engines': true
  bufferutil: false
  es5-ext: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  utf-8-validate: false

ignoredBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
